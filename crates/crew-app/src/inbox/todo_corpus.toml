# The todo card's corpus (goal 2026-10-22-inbox-smart-todo, phase 2): mails
# written for the test, each with the card it should give. `todoguess_tests`
# reads it with these known projects, folders and people, as `sam@x.org`:
#   projects: crew, rdactd, hive   folders: crew, rdactd, hive, docs, api
#   people: bo, ann
# An empty want is "nothing": no project, no assignee (yours), no due date.

[[case]]
name = "a GitHub notification names its repository"
subject = "[crew] Release workflow failed"
want_project = "crew"
[[case.mail]]
from = "GitHub <notifications@github.com>"
to = "Sam Doe <sam@x.org>"
date = "Tue, 20 Oct 2026 09:02:00 -0400"
text = "The Release workflow failed.\n\nView the run: https://github.com/ashishtyagi10/crew/actions/runs/123"

[[case]]
name = "a review request, an owner/repo subject and an @ of me"
subject = "[ashishtyagi10/rdactd] Add company search index (#42)"
want_project = "rdactd"
[[case.mail]]
from = "Bo Park <notifications@github.com>"
to = "Sam Doe <sam@x.org>"
date = "Tue, 20 Oct 2026 10:00:00 -0400"
text = "@sam requested your review on this pull request."

[[case]]
name = "a newsletter asks nothing"
subject = "Your weekly picks"
want_title = "Reply to Shop Co: Your weekly picks"
[[case.mail]]
from = "Shop Co <news@shop.io>"
to = "Sam Doe <sam@x.org>"
date = "Tue, 20 Oct 2026 08:00:00 -0400"
text = "Everything in the autumn collection is 30% off. Shop now.\n\nUnsubscribe"

