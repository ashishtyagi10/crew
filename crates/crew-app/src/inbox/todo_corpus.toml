to = "Sam Doe <sam@x.org>"
date = "Tue, 20 Oct 2026 09:02:00 -0400"
text = "Hi Sam,\n\nCan you send me the Q4 numbers for the roadmap by Friday?\n\nThanks,\nAnn"

