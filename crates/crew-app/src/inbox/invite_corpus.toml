# The invite reader's corpus (goal 2026-10-22-inbox-calendar, phase 1):
# invites written for the test in the shapes Google, Outlook, Teams, Zoom,
# Apple, Thunderbird and an airline send, each with what the card must say
# to someone reading it in New York and to someone in Kolkata, on Thu Oct
# 22 2026. Every time was worked out by hand from the zone's offset on the
# day, not copied from the reader's answer.

[[invite]]
