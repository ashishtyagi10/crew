[package]
name = "crew-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crew"
path = "src/main.rs"

[dependencies]
crew-plugin = { path = "../crew-plugin" }
crew-term = { path = "../crew-term" }
crew-render = { path = "../crew-render" }
winit.workspace = true
anyhow.workspace = true
ratatui.workspace = true
arboard = "3"
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
sysinfo = { workspace = true }
unicode-width = { workspace = true }
open = { workspace = true }
trash = { workspace = true }
walkdir = { workspace = true }
pulldown-cmark = { workspace = true }
crew-hive = { path = "../crew-hive" }
crew-theme = { path = "../crew-theme" }
tokio = { workspace = true }
self_update = { workspace = true }
# Header types for the update download. `self_update` hands back GitHub's *API*
# asset URL, which serves JSON metadata unless asked for octet-stream.
reqwest = { workspace = true }
# Staging directory for an update download. Runtime, not just dev: the archive
# is unpacked beside the binary it replaces (same volume, and out of %TEMP%).
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# setsid(2) for `--detach` (new session, so a closed terminal can't SIGHUP us).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Start-menu shortcut writer (pure Rust, no COM) for `install-app`.
[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
# Named-pipe server for the inter-pane `ask` IPC (`ipc_win.rs`) — the Windows
# stand-in for the Unix-domain socket. Client-side needs no bindings: a named
# pipe opens through `std::fs`.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # `wincon`: reattach the CLI modes to the launching shell's console, which
    # the GUI subsystem otherwise denies them.
    "Win32_System_Console",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Runtime Dock icon (terminal launches have no bundle identity).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    # `AppleInterfaceStyleSwitchesAutomatically` (see `osappearance`): tells a
    # scheduled OS appearance apart from a pinned one, which `auto` needs.
    "NSString",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWorkspace", "NSAccessibility"] }

[dev-dependencies]
# Offscreen render check (`swarm_shot`, #[ignore]d): draws a real mid-run chat
# pane through the same CellGrid the app uses and writes a PNG, so the layout
# can be verified with real fonts and no window — the GUI harness needs macOS
# Accessibility + Screen Recording, which CI and headless sessions lack.
wgpu.workspace = true
pollster = "0.4"
