[package]
name = "crew-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
winit.workspace = true
wgpu.workspace = true
glyphon.workspace = true
# The rasterizer under cosmic-text, named so crew can grow an outline before
# it is drawn (`outlineink`). Must stay the version cosmic-text resolves.
swash = "0.2.9"
anyhow.workspace = true
unicode-width = { workspace = true }
pollster = "0.4"
crew-theme = { path = "../crew-theme" }
threers.workspace = true

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
