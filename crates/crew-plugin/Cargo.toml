[package]
name = "crew-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
# Inbuilt /crew agents call the LLM API in-process via crew-hive's Provider,
# driven on the broker's sync thread with a small current-thread runtime.
crew-hive = { path = "../crew-hive" }
tokio = { workspace = true }
# Skill / plugin-agent / MCP discovery reads the user config dir.
dirs = { workspace = true }
# Integration manifests call HTTP APIs directly (broker/integration/): one
# manifest file, no Rust, no sidecar. The same client the providers use.
reqwest = { workspace = true }

# Integration tests (tests/) parse the broker's JSON event lines.
[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
