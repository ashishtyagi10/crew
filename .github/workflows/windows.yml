name: Windows

# The Windows build once rotted unnoticed for a dozen releases: nothing on CI
# compiled it, so a Unix-only `use` in the `ask` IPC silently dropped the
# platform. This job exists to make that failure loud on the commit that
# causes it rather than at the next release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Three superseded runs sat at 4h+ simultaneously once because nothing retired
# them: a push that lands while the previous one is still building makes the
# older run's verdict worthless, so cancel it rather than pay for it.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build + test (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    # Without this the job inherits GitHub's 6h default, so a hang reads as
    # "still building" for most of a day instead of failing. A cold cache
    # builds this in well under 45 minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Warnings are denied here specifically: the platform regressed through a
      # compile error, and unguarded per-OS code shows up as warnings first.
      - name: Check
        run: cargo check -p crew-app --bin crew
        env:
          RUSTFLAGS: -D warnings

      # The real point of the job. `ipc::tests::socket_round_trips_a_panes_request`
      # drives a live named pipe end to end (bind, connect, request, verdict),
      # which is the half of the port a cross-compile check cannot prove.
      - name: Test
        run: cargo test -p crew-app --bin crew
        # The named-pipe round-trip blocks on a connect/accept that has no
        # deadline of its own, so a regression there hangs rather than fails.
        # Cap the step to name the culprit in the log instead of the whole job.
        timeout-minutes: 15

      - name: Release build
        run: cargo build --release -p crew-app --bin crew

      # crew must be a GUI-subsystem binary: a console-subsystem one is handed
      # a console window by the OS before `main` runs, so every Start-menu
      # launch flashed a black window and nothing in the program could stop it.
      # Assert on the shipped PE header — the attribute is easy to drop and the
      # symptom only shows on a desktop nobody watches during CI.
      - name: Subsystem — the shipped exe is GUI, not console
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/crew.exe")
          $pe = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          Write-Host "PE Subsystem = $subsystem (2 = GUI, 3 = console)"
          if ($subsystem -ne 2) {
            throw "crew.exe is subsystem $subsystem, not 2 (GUI) — Windows will flash a console window on every launch"
          }

      # A smoke check that the shipped artifact is actually runnable — `crew`
      # with no console-mode subcommand would open the GUI, so use one that
      # returns before that path.
      #
      # `Start-Process -Wait` rather than a bare call: shells do NOT wait for a
      # GUI-subsystem process, so a plain invocation returns immediately and the
      # Test-Path below would race the shortcut being written.
      - name: Smoke — install-app registers per-user and exits
        run: |
          Start-Process -FilePath "./target/release/crew.exe" -ArgumentList "install-app" -Wait -NoNewWindow
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Crew.lnk")) {
            throw "install-app did not create the Start-menu shortcut"
          }
          Start-Process -FilePath "./target/release/crew.exe" -ArgumentList "install-app --remove" -Wait -NoNewWindow

      # The GUI subsystem takes stdio away from a terminal launch; `wincon`
      # gives it back. Piped output must survive that — the broker speaks a
      # JSON-line protocol over pipes, and `wincon` must never redirect a
      # handle the caller already set up.
      - name: Smoke — CLI output still reaches a pipe
        run: |
          $out = & "./target/release/crew.exe" --version 2>&1 | Out-String
          Write-Host "captured: '$($out.Trim())'"
          if ($out -notmatch "crew") {
            throw "crew --version produced no captured output — wincon is not wiring stdio, or it clobbered the pipe"
          }
